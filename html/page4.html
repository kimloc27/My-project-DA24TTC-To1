<!DOCTYPE html>
<html lang="vi">
      <head>
	<title>Bảng hóa đơn</title>
	<meta charset="utf-8">
	<link rel = "stylesheet" href = "../css/style.css">
      </head>
      <body>
            <table border="1">
                <caption>Hóa đơn thanh toán</caption>
                <tr>
                    <th>STT</th>
                    <th>Tên sản phẩm</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                    <th>Thành tiền</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>A</td>
                    <td class="sl">3</td>
                    <td class="dg">1000</td>
                    <td class="tt"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>B</td>
                    <td class="sl">2</td>
                    <td class="dg">2000</td>
                    <td class="tt"></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>C</td>
                    <td class="sl">4</td>
                    <td class="dg">3000</td>
                    <td class="tt"></td>
                </tr>
                <tr>
                    <td colspan="3">Tổng thanh toán</td>
                    <td colspan="2" id="tongthanhtoan"></td>
                </tr>
            </table>
            <script>
                const soluong=document.getElementsByClassName("sl");
                const dongia=document.getElementsByClassName("dg");
                const thanhtien=document.getElementsByClassName("tt");
                    let tongthanhtoan=0;
                    for(let i=0;i<dongia.length;i++)
                {
                    thanhtien[i].innerHTML=soluong[i].innerHTML*dongia[i].innerHTML;
                    tongthanhtoan +=parseInt(thanhtien[i].innerHTML)
                }
                document.getElementById("tongthanhtoan").innerHTML=tongthanhtoan;

            </script>
      </body>
</html>
