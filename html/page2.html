<!DOCTYPE html>
<html lang="vi">
      <head>
	<title>Form đăng nhập</title>
	<meta charset="utf-8">
	<link rel = "stylesheet" href = "../css/style2.css">
      </head>
      <body>
        <div class="container">
			<form id="frmLogin">
				<h3 class="title">Đăng nhập hệ thống</h3>
				<div class="form-group">
					<label for="txtUsername">Tên đăng nhập:</label>
					<input class="form-control" type="text" id="txtUsername" name="textUsername" placeholder="Nhập tên đăng nhập" required>
				</div>
				<div class="form-group">
					<label for="txtPassword">Mật khẩu:</label>
					<input class="form-control" type="password" id="txtPassword" name="textPassword" placeholder="Nhập mật khẩu" required>
				</div>
				<div class="buttons">
					<input class="but" type="submit" name="sbLogin" value="Đăng nhập">
				    <input class="but" type="reset" name="rsCancel" value="Hủy đăng nhập">
				</div>
			</form>
		</div>
      </body>


</html>
